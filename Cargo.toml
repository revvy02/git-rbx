[package]
name = "git-rbx"
version = "0.0.2"
edition = "2021"
description = "Semantic diff, three-way merge, and conflict resolution for Roblox place/model files, as a git extension (git rbx)"
autobins = false

# The CLI ships as a git extension so `git rbx <subcommand>` resolves to it;
# the library is `git_rbx`.
[[bin]]
name = "git-rbx"
path = "src/main.rs"

[dependencies]
rbx_dom_weak = { path = "rbx-dom/rbx_dom_weak" }
rbx_types = { path = "rbx-dom/rbx_types" }
rbx_xml = { path = "rbx-dom/rbx_xml" }
rbx_binary = { path = "rbx-dom/rbx_binary" }
blake3 = "1.5"
rbx_reflection = { path = "rbx-dom/rbx_reflection" }
rbx_reflection_database = { path = "rbx-dom/rbx_reflection_database" }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
colored = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustc-hash = "2.1.3"

[profile.release]
lto = true
codegen-units = 1
