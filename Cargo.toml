[package]
name = "rbx-diff"
version = "0.1.0"
edition = "2021"
description = "Diff tool for comparing Roblox rbxm/rbxmx files"

[dependencies]
rbx_dom_weak = "4.2"
rbx_types = "3.1"
rbx_xml = "3.0"
rbx_binary = "3.0"
blake3 = "1.5"
rbx_reflection = "7.0"
rbx_reflection_database = "3.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
colored = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
codegen-units = 1
