[package]
name = "rbx-diff-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
rbx-diff = { path = "../rbx-diff" }
rbx_dom_weak = "4.1"
rbx_types = "3.1"
rbx_binary = "2.0"
rbx_xml = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
flate2 = "1.0"
