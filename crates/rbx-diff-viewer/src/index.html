<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rbx-diff-viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Upload screen */
    .upload-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1e1e1e;
    }

    .upload-container {
      text-align: center;
      padding: 48px;
      background: #252526;
      border-radius: 8px;
      border: 1px solid #404040;
      max-width: 600px;
      width: 90%;
    }

    .upload-container h2 {
      color: #fff;
      font-size: 18px;
      font-weight: normal;
      margin-bottom: 8px;
    }

    .upload-container p {
      color: #808080;
      font-size: 12px;
      margin-bottom: 24px;
    }

    .upload-row {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
    }

    .upload-box {
      flex: 1;
      padding: 24px 16px;
      border: 2px dashed #404040;
      border-radius: 8px;
      transition: border-color 0.2s;
    }

    .upload-box:hover {
      border-color: #606060;
    }

    .upload-box.has-file {
      border-color: #4ec9b0;
      border-style: solid;
    }

    .upload-box-label {
      color: #808080;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .upload-box button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      transition: background 0.2s;
    }

    .upload-box button:hover {
      background: #1177bb;
    }

    .file-label {
      display: block;
      margin-top: 12px;
      color: #808080;
      font-size: 11px;
      word-break: break-all;
    }

    .file-label.selected {
      color: #4ec9b0;
    }

    .compare-btn {
      background: #0e639c;
      color: white;
      border: none;
      padding: 12px 48px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: background 0.2s;
    }

    .compare-btn:hover:not(:disabled) {
      background: #1177bb;
    }

    .compare-btn:disabled {
      background: #404040;
      cursor: not-allowed;
      color: #808080;
    }

    .upload-error {
      color: #f14c4c;
      font-size: 12px;
      margin-top: 16px;
      min-height: 18px;
    }

    /* Diff view (hidden initially if no files) */
    .diff-view {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .hidden { display: none !important; }

    /* Header */
    .header {
      padding: 8px 16px;
      background: #2d2d2d;
      border-bottom: 1px solid #404040;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 14px;
      font-weight: normal;
      color: #fff;
    }
    .file-names {
      color: #808080;
      font-size: 12px;
    }
    .summary-badge {
      margin-left: auto;
      display: flex;
      gap: 12px;
      font-size: 12px;
    }
    .summary-badge .added { color: #4ec9b0; }
    .summary-badge .removed { color: #f14c4c; }
    .summary-badge .modified { color: #dcdcaa; }

    .new-compare-btn {
      background: #404040;
      color: #d4d4d4;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      margin-left: 16px;
    }
    .new-compare-btn:hover {
      background: #505050;
    }

    /* 3-column layout */
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 200px;
    }
    .panel.file-panel {
      flex: 1;
    }
    .panel.diff-panel {
      flex: 1.5;
    }

    .panel-header {
      padding: 8px 12px;
      background: #252526;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #808080;
      border-bottom: 1px solid #404040;
      flex-shrink: 0;
    }

    .panel-content {
      flex: 1;
      overflow: auto;
      padding: 4px 0;
    }

    /* Tree styles */
    .tree-node {
      user-select: none;
    }
    .node-row {
      padding: 2px 8px 2px 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .node-row:hover { background: #2a2d2e; }
    .node-row.highlighted { background: #094771 !important; }
    .node-row.added { background: rgba(78, 201, 176, 0.15); }
    .node-row.removed { background: rgba(241, 76, 76, 0.15); }
    .node-row.modified { background: rgba(220, 220, 170, 0.15); }

    .expand-icon {
      width: 16px;
      text-align: center;
      color: #808080;
      font-size: 10px;
      flex-shrink: 0;
    }
    .expand-icon:hover { color: #fff; }

    .class-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      image-rendering: pixelated;
    }

    .node-name { color: #d4d4d4; }
    .node-class { color: #606060; margin-left: 4px; font-size: 11px; }

    .children { padding-left: 16px; }
    .children.collapsed { display: none; }

    /* Diff panel - tree view */
    .diff-node.added .node-name { color: #4ec9b0; }
    .diff-node.removed .node-name { color: #f14c4c; text-decoration: line-through; }
    .diff-node.modified .node-name { color: #dcdcaa; }

    .change-indicator {
      width: 12px;
      font-weight: bold;
      font-size: 12px;
      text-align: center;
    }
    .change-indicator.added { color: #4ec9b0; }
    .change-indicator.removed { color: #f14c4c; }
    .change-indicator.modified { color: #dcdcaa; }

    .diff-properties {
      padding-left: 48px;
      padding-bottom: 4px;
    }
    .diff-properties .property-changes {
      padding: 2px 0;
      font-size: 11px;
    }
    .property-change {
      padding: 1px 0;
      color: #808080;
    }
    .prop-name { color: #9cdcfe; }
    .prop-old { color: #f14c4c; }
    .prop-new { color: #4ec9b0; }
    .prop-arrow { color: #606060; margin: 0 4px; }

    /* Loading state */
    .loading {
      padding: 20px;
      text-align: center;
      color: #808080;
    }

    /* Split panes for file panels */
    .file-panel .split-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .explorer-pane, .properties-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 100px;
    }

    .properties-pane {
      min-height: 80px;
    }

    .pane-header {
      padding: 4px 8px;
      background: #252526;
      font-size: 10px;
      color: #808080;
      text-transform: uppercase;
      flex-shrink: 0;
      border-bottom: 1px solid #333;
    }

    .pane-content {
      flex: 1;
      overflow: auto;
      padding: 4px 0;
    }

    .no-selection {
      padding: 12px;
      color: #606060;
      font-style: italic;
    }

    /* Property list */
    .property-row {
      display: flex;
      padding: 2px 8px;
      font-size: 12px;
    }
    .property-row:hover { background: #2a2d2e; }
    .property-name {
      color: #9cdcfe;
      width: 140px;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .property-value {
      color: #ce9178;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .property-type {
      color: #606060;
      font-size: 10px;
      margin-left: 8px;
      flex-shrink: 0;
    }

    /* Selected node */
    .node-row.selected {
      background: #094771 !important;
      outline: 1px solid #007acc;
    }

    /* Resize handles */
    .resize-handle {
      background: #404040;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .resize-handle:hover {
      background: #007acc;
    }
    .resize-handle.active {
      background: #007acc;
    }
    .resize-handle.vertical {
      width: 4px;
      cursor: col-resize;
    }
    .resize-handle.horizontal {
      height: 4px;
      cursor: row-resize;
    }

    /* Prevent text selection during resize */
    body.resizing {
      user-select: none;
      cursor: col-resize;
    }
    body.resizing-vertical {
      cursor: row-resize;
    }
  </style>
</head>
<body>
  <!-- Upload screen (shown when no files loaded) -->
  <div id="uploadScreen" class="upload-screen">
    <div class="upload-container">
      <h2>rbx-diff-viewer</h2>
      <p>Select two .rbxm or .rbxmx files to compare</p>
      <div class="upload-row">
        <div class="upload-box" id="oldUploadBox">
          <div class="upload-box-label">Old File (Base)</div>
          <input type="file" id="oldFile" accept=".rbxm,.rbxmx" hidden>
          <button onclick="document.getElementById('oldFile').click()">Select File</button>
          <span class="file-label" id="oldFileLabel">No file selected</span>
        </div>
        <div class="upload-box" id="newUploadBox">
          <div class="upload-box-label">New File (Changed)</div>
          <input type="file" id="newFile" accept=".rbxm,.rbxmx" hidden>
          <button onclick="document.getElementById('newFile').click()">Select File</button>
          <span class="file-label" id="newFileLabel">No file selected</span>
        </div>
      </div>
      <button id="compareBtn" class="compare-btn" disabled>Compare Files</button>
      <div id="uploadError" class="upload-error"></div>
    </div>
  </div>

  <!-- Diff view (shown when files loaded) -->
  <div id="diffView" class="diff-view hidden">
    <div class="header">
      <h1>rbx-diff-viewer</h1>
      <span class="file-names" id="fileNames">Loading...</span>
      <div class="summary-badge" id="summary"></div>
      <button class="new-compare-btn" id="newCompareBtn">New Compare</button>
    </div>

    <div class="container">
      <div class="panel file-panel" id="oldPanel">
        <div class="panel-header">Old File</div>
        <div class="split-container">
          <div class="explorer-pane" id="oldExplorerPane">
            <div class="pane-header">Explorer</div>
            <div class="pane-content" id="oldTree">
              <div class="loading">Loading...</div>
            </div>
          </div>
          <div class="resize-handle horizontal" data-target="oldExplorerPane"></div>
          <div class="properties-pane">
            <div class="pane-header">Properties</div>
            <div class="pane-content" id="oldProperties">
              <div class="no-selection">Select an instance</div>
            </div>
          </div>
        </div>
      </div>
      <div class="resize-handle vertical" data-target="oldPanel"></div>
      <div class="panel file-panel" id="newPanel">
        <div class="panel-header">New File</div>
        <div class="split-container">
          <div class="explorer-pane" id="newExplorerPane">
            <div class="pane-header">Explorer</div>
            <div class="pane-content" id="newTree">
              <div class="loading">Loading...</div>
            </div>
          </div>
          <div class="resize-handle horizontal" data-target="newExplorerPane"></div>
          <div class="properties-pane">
            <div class="pane-header">Properties</div>
            <div class="pane-content" id="newProperties">
              <div class="no-selection">Select an instance</div>
            </div>
          </div>
        </div>
      </div>
      <div class="resize-handle vertical" data-target="newPanel"></div>
      <div class="panel diff-panel">
        <div class="panel-header">Changes</div>
        <div class="panel-content" id="diffPanel">
          <div class="loading">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State
    let oldTree = null;
    let newTree = null;
    let diffs = null;
    let meta = null;
    let classIcons = {};

    // Limit initial diff items to prevent browser freeze on large diffs
    const MAX_INITIAL_ITEMS = 100;

    // Selection state
    let selectedRef = null;
    let selectedSide = null;

    // Upload state
    let oldFile = null;
    let newFile = null;

    // Maps for quick lookup: ref -> change type
    let oldRefMap = {};  // ref -> 'removed' | 'modified'
    let newRefMap = {};  // ref -> 'added' | 'modified'

    // ========================================================================
    // Upload handling
    // ========================================================================

    document.getElementById('oldFile').addEventListener('change', (e) => {
      oldFile = e.target.files[0];
      const label = document.getElementById('oldFileLabel');
      const box = document.getElementById('oldUploadBox');
      if (oldFile) {
        label.textContent = oldFile.name;
        label.classList.add('selected');
        box.classList.add('has-file');
      } else {
        label.textContent = 'No file selected';
        label.classList.remove('selected');
        box.classList.remove('has-file');
      }
      updateCompareButton();
    });

    document.getElementById('newFile').addEventListener('change', (e) => {
      newFile = e.target.files[0];
      const label = document.getElementById('newFileLabel');
      const box = document.getElementById('newUploadBox');
      if (newFile) {
        label.textContent = newFile.name;
        label.classList.add('selected');
        box.classList.add('has-file');
      } else {
        label.textContent = 'No file selected';
        label.classList.remove('selected');
        box.classList.remove('has-file');
      }
      updateCompareButton();
    });

    function updateCompareButton() {
      document.getElementById('compareBtn').disabled = !(oldFile && newFile);
    }

    document.getElementById('compareBtn').addEventListener('click', async () => {
      const formData = new FormData();
      formData.append('old', oldFile);
      formData.append('new', newFile);

      const btn = document.getElementById('compareBtn');
      const errorDiv = document.getElementById('uploadError');
      btn.textContent = 'Uploading...';
      btn.disabled = true;
      errorDiv.textContent = '';

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const result = await res.json();

        if (result.success) {
          document.getElementById('uploadScreen').classList.add('hidden');
          document.getElementById('diffView').classList.remove('hidden');
          await loadData();
        } else {
          errorDiv.textContent = result.error || 'Upload failed';
        }
      } catch (err) {
        errorDiv.textContent = 'Upload failed: ' + err.message;
      }

      btn.textContent = 'Compare Files';
      updateCompareButton();
    });

    // New Compare button
    document.getElementById('newCompareBtn').addEventListener('click', () => {
      // Reset state
      oldFile = null;
      newFile = null;
      oldTree = null;
      newTree = null;
      diffs = null;
      meta = null;

      // Reset file inputs
      document.getElementById('oldFile').value = '';
      document.getElementById('newFile').value = '';
      document.getElementById('oldFileLabel').textContent = 'No file selected';
      document.getElementById('oldFileLabel').classList.remove('selected');
      document.getElementById('oldUploadBox').classList.remove('has-file');
      document.getElementById('newFileLabel').textContent = 'No file selected';
      document.getElementById('newFileLabel').classList.remove('selected');
      document.getElementById('newUploadBox').classList.remove('has-file');
      document.getElementById('uploadError').textContent = '';
      updateCompareButton();

      // Show upload screen
      document.getElementById('diffView').classList.add('hidden');
      document.getElementById('uploadScreen').classList.remove('hidden');
    });

    // Check if files already loaded (from CLI)
    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const { loaded } = await res.json();

        if (loaded) {
          document.getElementById('uploadScreen').classList.add('hidden');
          document.getElementById('diffView').classList.remove('hidden');
          await loadData();
        }
      } catch (err) {
        console.error('Failed to check status:', err);
      }
    }

    // ========================================================================
    // Data loading and rendering
    // ========================================================================

    // Load class icons mapping
    async function loadClassIcons() {
      try {
        const res = await fetch('/api/class-icons');
        classIcons = await res.json();
      } catch (err) {
        console.warn('Failed to load class icons:', err);
      }
    }

    // Get icon URL from class name
    function getClassIconUrl(className) {
      const iconData = classIcons[className];
      if (!iconData || !iconData.Image) return null;
      // Extract filename from rbxasset://.../<filename>.png
      const match = iconData.Image.match(/\/([^\/]+)$/);
      return match ? `/images/${match[1]}` : null;
    }

    // Load all data
    async function loadData() {
      console.log('[loadData] Starting...');

      // Clear old state before loading new data
      oldRefMap = {};
      newRefMap = {};
      selectedRef = null;
      selectedSide = null;

      // Show loading state
      document.getElementById('oldTree').innerHTML = '<div class="loading">Loading...</div>';
      document.getElementById('newTree').innerHTML = '<div class="loading">Loading...</div>';
      document.getElementById('diffPanel').innerHTML = '<div class="loading">Loading...</div>';
      document.getElementById('oldProperties').innerHTML = '<div class="no-selection">Select an instance</div>';
      document.getElementById('newProperties').innerHTML = '<div class="no-selection">Select an instance</div>';

      try {
        // Load class icons first (doesn't block other requests)
        await loadClassIcons();
        console.log('[loadData] Class icons loaded');

        console.log('[loadData] Fetching data from server...');
        const [metaRes, oldRes, newRes, diffsRes] = await Promise.all([
          fetch('/api/meta'),
          fetch('/api/old-tree'),
          fetch('/api/new-tree'),
          fetch('/api/diffs'),
        ]);

        console.log('[loadData] Parsing responses...');
        meta = await metaRes.json();
        console.log('[loadData] Meta:', meta);

        oldTree = await oldRes.json();
        console.log('[loadData] Old tree loaded');

        newTree = await newRes.json();
        console.log('[loadData] New tree loaded');

        diffs = await diffsRes.json();
        console.log('[loadData] Diffs loaded, count:', diffs?.length);

        // Handle null responses (no files loaded) - fall back to upload screen
        if (!meta || !oldTree || !newTree || !diffs) {
          console.warn('[loadData] No data loaded - showing upload screen');
          document.getElementById('diffView').classList.add('hidden');
          document.getElementById('uploadScreen').classList.remove('hidden');
          return;
        }

        // Build ref maps
        console.log('[loadData] Building ref maps...');
        buildRefMaps();

        // Render UI
        console.log('[loadData] Rendering meta...');
        renderMeta();

        console.log('[loadData] Rendering old tree...');
        renderTree('oldTree', oldTree, 'old');

        console.log('[loadData] Rendering new tree...');
        renderTree('newTree', newTree, 'new');

        console.log('[loadData] Rendering diffs...');
        renderDiffs();

        console.log('[loadData] Complete!');
      } catch (err) {
        console.error('[loadData] Failed:', err);
        // On error, show error in the panels instead of going back to upload
        document.getElementById('oldTree').innerHTML = '<div class="loading" style="color: #f14c4c;">Error: ' + escapeHtml(err.message) + '</div>';
        document.getElementById('newTree').innerHTML = '<div class="loading" style="color: #f14c4c;">Error loading</div>';
        document.getElementById('diffPanel').innerHTML = '<div class="loading" style="color: #f14c4c;">Error loading</div>';
      }
    }

    function buildRefMaps() {
      oldRefMap = {};
      newRefMap = {};

      for (const diff of diffs) {
        if (diff.type === 'removed') {
          oldRefMap[diff.old_ref] = 'removed';
        } else if (diff.type === 'added') {
          newRefMap[diff.new_ref] = 'added';
        } else if (diff.type === 'modified') {
          oldRefMap[diff.old_ref] = 'modified';
          newRefMap[diff.new_ref] = 'modified';
        }
      }
    }

    function renderMeta() {
      document.getElementById('fileNames').textContent =
        `${meta.old_name} → ${meta.new_name}`;

      document.getElementById('summary').innerHTML = `
        <span class="added">+${meta.summary.added} added</span>
        <span class="removed">-${meta.summary.removed} removed</span>
        <span class="modified">~${meta.summary.modified} modified</span>
      `;
    }

    function renderTree(containerId, node, side) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      // Render only root level initially with lazy loading for children
      container.appendChild(createNodeElement(node, side, 0));
    }

    function createNodeElement(node, side, depth) {
      const div = document.createElement('div');
      div.className = 'tree-node';
      div.dataset.ref = node.ref;

      const refMap = side === 'old' ? oldRefMap : newRefMap;
      const changeType = refMap[node.ref] || '';
      // Use has_children from server, or check children array
      const hasChildren = node.has_children || (node.children && node.children.length > 0);
      // Collapse everything except root (depth 0) and first level (depth 1)
      const isCollapsed = depth > 1;

      const row = document.createElement('div');
      row.className = 'node-row ' + changeType;
      row.dataset.ref = node.ref;

      // Get class icon
      const iconUrl = getClassIconUrl(node.class);
      const iconHtml = iconUrl
        ? `<img class="class-icon" src="${iconUrl}" alt="" onerror="this.style.display='none'">`
        : '<span class="class-icon"></span>';

      row.innerHTML = `
        <span class="expand-icon">${hasChildren ? (isCollapsed ? '▶' : '▼') : ''}</span>
        ${iconHtml}
        <span class="node-name">${escapeHtml(node.name)}</span>
        <span class="node-class">[${node.class}]</span>
      `;
      div.appendChild(row);

      // Add click handler for row selection
      row.addEventListener('click', () => {
        selectInstance(node.ref, side);
      });

      if (hasChildren) {
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'children' + (isCollapsed ? ' collapsed' : '');

        if (!isCollapsed && node.children && node.children.length > 0) {
          // Render children immediately for first 2 levels
          for (const child of node.children) {
            childrenDiv.appendChild(createNodeElement(child, side, depth + 1));
          }
        } else if (isCollapsed && node.children && node.children.length > 0) {
          // Store children data for lazy loading (if we have them)
          childrenDiv.dataset.childrenData = JSON.stringify(node.children);
          childrenDiv.dataset.side = side;
          childrenDiv.dataset.depth = String(depth + 1);
        } else {
          // Need to fetch from server
          childrenDiv.dataset.needsFetch = 'true';
          childrenDiv.dataset.parentRef = node.ref;
          childrenDiv.dataset.side = side;
          childrenDiv.dataset.depth = String(depth + 1);
        }
        div.appendChild(childrenDiv);

        // Add click handler for expand/collapse
        const expandIcon = row.querySelector('.expand-icon');
        if (expandIcon) {
          expandIcon.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (childrenDiv.classList.contains('collapsed')) {
              // Lazy load children if needed
              if (childrenDiv.dataset.childrenData) {
                const childData = JSON.parse(childrenDiv.dataset.childrenData);
                const childSide = childrenDiv.dataset.side;
                const childDepth = parseInt(childrenDiv.dataset.depth);
                for (const child of childData) {
                  childrenDiv.appendChild(createNodeElement(child, childSide, childDepth));
                }
                delete childrenDiv.dataset.childrenData;
              } else if (childrenDiv.dataset.needsFetch) {
                // Fetch children from server
                const parentRef = childrenDiv.dataset.parentRef;
                const childSide = childrenDiv.dataset.side;
                const childDepth = parseInt(childrenDiv.dataset.depth);
                try {
                  const res = await fetch(`/api/children?ref=${encodeURIComponent(parentRef)}&side=${childSide}`);
                  const children = await res.json();
                  for (const child of children) {
                    childrenDiv.appendChild(createNodeElement(child, childSide, childDepth));
                  }
                  delete childrenDiv.dataset.needsFetch;
                } catch (err) {
                  console.error('Failed to fetch children:', err);
                }
              }
              childrenDiv.classList.remove('collapsed');
              expandIcon.textContent = '▼';
            } else {
              childrenDiv.classList.add('collapsed');
              expandIcon.textContent = '▶';
            }
          });
        }
      }

      return div;
    }

    function renderDiffs() {
      const container = document.getElementById('diffPanel');
      const tree = buildDiffTree(diffs);
      container.innerHTML = '';

      // Render the tree starting from root's children (skip DataModel root)
      const childNames = Object.keys(tree.children).sort();
      for (const name of childNames) {
        container.appendChild(createDiffTreeNode(tree.children[name], 0));
      }
    }

    function buildDiffTree(diffs) {
      const root = { name: 'DataModel', children: {}, changeType: null, diff: null, class: 'DataModel' };

      for (const diff of diffs) {
        const parts = diff.path.split('/');
        let node = root;

        for (let i = 0; i < parts.length; i++) {
          const name = parts[i];
          if (!node.children[name]) {
            node.children[name] = {
              name,
              children: {},
              changeType: null,
              diff: null,
              class: null
            };
          }
          node = node.children[name];

          // Mark leaf node with change info
          if (i === parts.length - 1) {
            node.changeType = diff.type;
            node.diff = diff;
            node.class = diff.class;
          }
        }
      }
      return root;
    }

    function createDiffTreeNode(node, depth) {
      const div = document.createElement('div');
      div.className = 'tree-node';

      const hasChildren = Object.keys(node.children).length > 0;
      const isCollapsed = depth > 1;
      const changeType = node.changeType || '';

      // Get class icon
      let iconHtml = '';
      if (node.class && classIcons[node.class]) {
        const iconData = classIcons[node.class];
        iconHtml = `<img class="class-icon" src="data:image/png;base64,${iconData}" alt="${node.class}">`;
      } else if (node.class) {
        iconHtml = `<span class="class-icon-placeholder"></span>`;
      }

      // Create the row
      const row = document.createElement('div');
      row.className = 'node-row diff-node ' + changeType;
      if (node.diff) {
        row.dataset.oldRef = node.diff.old_ref || '';
        row.dataset.newRef = node.diff.new_ref || '';
      }

      // Change type indicator
      let changeIndicator = '';
      if (changeType === 'added') changeIndicator = '<span class="change-indicator added">+</span>';
      else if (changeType === 'removed') changeIndicator = '<span class="change-indicator removed">−</span>';
      else if (changeType === 'modified') changeIndicator = '<span class="change-indicator modified">~</span>';

      row.innerHTML = `
        <span class="expand-icon">${hasChildren ? (isCollapsed ? '▶' : '▼') : ''}</span>
        ${changeIndicator}
        ${iconHtml}
        <span class="node-name">${escapeHtml(node.name)}</span>
        ${node.class ? `<span class="node-class">[${node.class}]</span>` : ''}
      `;

      div.appendChild(row);

      // Add property changes for modified nodes
      if (node.diff && node.diff.property_changes && node.diff.property_changes.length > 0) {
        const propsDiv = document.createElement('div');
        propsDiv.className = 'diff-properties';
        propsDiv.innerHTML = renderPropertyChanges(node.diff.property_changes);
        div.appendChild(propsDiv);
      }

      // Add children container
      if (hasChildren) {
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'children' + (isCollapsed ? ' collapsed' : '');

        // Sort children: modified first, then added, then removed, then unchanged
        const childNames = Object.keys(node.children).sort((a, b) => {
          const aType = node.children[a].changeType;
          const bType = node.children[b].changeType;
          const order = { modified: 0, added: 1, removed: 2, null: 3 };
          const aOrder = order[aType] ?? 3;
          const bOrder = order[bType] ?? 3;
          if (aOrder !== bOrder) return aOrder - bOrder;
          return a.localeCompare(b);
        });

        if (isCollapsed) {
          // Store children data for lazy loading
          childrenDiv.dataset.childrenData = JSON.stringify(
            childNames.map(name => node.children[name])
          );
          childrenDiv.dataset.depth = depth + 1;
        } else {
          // Render children immediately
          for (const name of childNames) {
            childrenDiv.appendChild(createDiffTreeNode(node.children[name], depth + 1));
          }
        }

        div.appendChild(childrenDiv);

        // Add expand/collapse handler
        const expandIcon = row.querySelector('.expand-icon');
        expandIcon.addEventListener('click', (e) => {
          e.stopPropagation();
          const isCurrentlyCollapsed = childrenDiv.classList.contains('collapsed');

          if (isCurrentlyCollapsed) {
            // Expand - render children if needed
            if (childrenDiv.dataset.childrenData) {
              const childrenData = JSON.parse(childrenDiv.dataset.childrenData);
              const childDepth = parseInt(childrenDiv.dataset.depth);
              for (const childNode of childrenData) {
                childrenDiv.appendChild(createDiffTreeNode(childNode, childDepth));
              }
              delete childrenDiv.dataset.childrenData;
              delete childrenDiv.dataset.depth;
            }
            childrenDiv.classList.remove('collapsed');
            expandIcon.textContent = '▼';
          } else {
            childrenDiv.classList.add('collapsed');
            expandIcon.textContent = '▶';
          }
        });
      }

      // Add click handler to highlight in trees
      row.addEventListener('click', () => {
        const oldRef = row.dataset.oldRef;
        const newRef = row.dataset.newRef;
        if (oldRef) highlightRef(oldRef);
        if (newRef) highlightRef(newRef);
      });

      return div;
    }

    function renderPropertyChanges(changes) {
      if (!changes || changes.length === 0) return '';

      let html = '<div class="property-changes">';
      for (const prop of changes) {
        const oldVal = formatValue(prop.old_value);
        const newVal = formatValue(prop.new_value);

        if (prop.old_value && prop.new_value) {
          html += `
            <div class="property-change">
              <span class="prop-name">${escapeHtml(prop.name)}:</span>
              <span class="prop-old">${oldVal}</span>
              <span class="prop-arrow">→</span>
              <span class="prop-new">${newVal}</span>
            </div>
          `;
        } else if (prop.new_value) {
          html += `
            <div class="property-change">
              <span class="prop-name">${escapeHtml(prop.name)}:</span>
              <span class="prop-new">+ ${newVal}</span>
            </div>
          `;
        } else if (prop.old_value) {
          html += `
            <div class="property-change">
              <span class="prop-name">${escapeHtml(prop.name)}:</span>
              <span class="prop-old">- ${oldVal}</span>
            </div>
          `;
        }
      }
      html += '</div>';
      return html;
    }

    function formatValue(val) {
      if (!val) return 'nil';
      if (!val.value) return 'nil';

      switch (val.type) {
        case 'nil': return 'nil';
        case 'bool': return val.value.value?.toString() ?? 'nil';
        case 'int32':
        case 'int64': return val.value.value?.toString() ?? 'nil';
        case 'float32':
        case 'float64':
          return val.value.value != null ? val.value.value.toFixed(2) : 'NaN';
        case 'string':
          const s = val.value.value ?? '';
          return s.length > 30 ? `"${s.slice(0, 27)}..."` : `"${s}"`;
        case 'ref':
          const r = val.value.value;
          return r ? `Ref(${r.slice(0, 8)})` : 'nil';
        case 'vector2':
          return `(${(val.value.x ?? 0).toFixed(1)}, ${(val.value.y ?? 0).toFixed(1)})`;
        case 'vector3':
          return `(${(val.value.x ?? 0).toFixed(1)}, ${(val.value.y ?? 0).toFixed(1)}, ${(val.value.z ?? 0).toFixed(1)})`;
        case 'color3':
          return `Color3(${(val.value.r ?? 0).toFixed(2)}, ${(val.value.g ?? 0).toFixed(2)}, ${(val.value.b ?? 0).toFixed(2)})`;
        case 'enum':
          return `Enum(${val.value.value ?? 0})`;
        case 'cframe':
          const p = val.value.position ?? [0, 0, 0];
          return `CFrame(${p[0]?.toFixed(1) ?? 0}, ${p[1]?.toFixed(1) ?? 0}, ${p[2]?.toFixed(1) ?? 0})`;
        case 'udim':
          return `UDim(${(val.value.scale ?? 0).toFixed(2)}, ${val.value.offset ?? 0})`;
        case 'udim2':
          return `UDim2({${(val.value.x_scale ?? 0).toFixed(2)}, ${val.value.x_offset ?? 0}}, {${(val.value.y_scale ?? 0).toFixed(2)}, ${val.value.y_offset ?? 0}})`;
        case 'binary_string':
          return `<binary ${val.value.len ?? 0} bytes>`;
        default:
          return val.type;
      }
    }

    async function selectInstance(ref, side) {
      // Clear previous selection
      document.querySelectorAll('.node-row.selected').forEach(el => {
        el.classList.remove('selected');
      });

      // Mark new selection
      selectedRef = ref;
      selectedSide = side;

      // Find and highlight the row
      const row = document.querySelector(`.node-row[data-ref="${ref}"]`);
      if (row) {
        row.classList.add('selected');
        expandParents(row);
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      // Load properties
      await loadProperties(ref, side);
    }

    async function loadProperties(ref, side) {
      const containerId = side === 'old' ? 'oldProperties' : 'newProperties';
      const container = document.getElementById(containerId);

      container.innerHTML = '<div class="loading">Loading...</div>';

      try {
        const res = await fetch(`/api/properties?ref=${encodeURIComponent(ref)}&side=${side}`);
        const props = await res.json();

        if (props.length === 0) {
          container.innerHTML = '<div class="no-selection">No properties</div>';
          return;
        }

        container.innerHTML = props.map(p => `
          <div class="property-row">
            <span class="property-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</span>
            <span class="property-value" title="${escapeHtml(p.value)}">${escapeHtml(p.value)}</span>
            <span class="property-type">${escapeHtml(p.type)}</span>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load properties:', err);
        container.innerHTML = '<div class="no-selection">Failed to load</div>';
      }
    }

    function highlightRef(ref) {
      // Remove all highlights
      document.querySelectorAll('.node-row.highlighted').forEach(el => {
        el.classList.remove('highlighted');
      });

      // Add highlights
      document.querySelectorAll(`.node-row[data-ref="${ref}"]`).forEach(el => {
        el.classList.add('highlighted');
        // Expand parents and scroll into view
        expandParents(el);
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }

    function expandParents(el) {
      let parent = el.parentElement;
      while (parent) {
        if (parent.classList.contains('children') && parent.classList.contains('collapsed')) {
          parent.classList.remove('collapsed');
          const icon = parent.previousElementSibling?.querySelector('.expand-icon');
          if (icon) icon.textContent = '▼';
        }
        parent = parent.parentElement;
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ========================================================================
    // Resize handles
    // ========================================================================

    let resizing = null;
    let startX = 0;
    let startY = 0;
    let startWidth = 0;
    let startHeight = 0;

    document.querySelectorAll('.resize-handle').forEach(handle => {
      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        resizing = handle;
        handle.classList.add('active');
        startX = e.clientX;
        startY = e.clientY;

        const targetId = handle.dataset.target;
        const target = document.getElementById(targetId);
        if (target) {
          startWidth = target.offsetWidth;
          startHeight = target.offsetHeight;
        }

        if (handle.classList.contains('vertical')) {
          document.body.classList.add('resizing');
        } else {
          document.body.classList.add('resizing', 'resizing-vertical');
        }
      });
    });

    document.addEventListener('mousemove', (e) => {
      if (!resizing) return;

      const targetId = resizing.dataset.target;
      const target = document.getElementById(targetId);
      if (!target) return;

      if (resizing.classList.contains('vertical')) {
        // Horizontal resize (column width)
        const dx = e.clientX - startX;
        const newWidth = Math.max(200, startWidth + dx);
        target.style.width = `${newWidth}px`;
        target.style.flex = 'none';
      } else {
        // Vertical resize (row height)
        const dy = e.clientY - startY;
        const newHeight = Math.max(80, startHeight + dy);
        target.style.height = `${newHeight}px`;
        target.style.flex = 'none';
      }
    });

    document.addEventListener('mouseup', () => {
      if (resizing) {
        resizing.classList.remove('active');
        resizing = null;
        document.body.classList.remove('resizing', 'resizing-vertical');
      }
    });

    // Check status on startup
    checkStatus();
  </script>
</body>
</html>
