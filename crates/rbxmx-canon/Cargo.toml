[package]
name = "rbxmx-canon"
version = "0.1.0"
edition = "2021"
description = "Canonicalize rbxmx files for deterministic diffs"

[dependencies]
rbx_dom_weak = "4.1"
rbx_types = "3.1"
rbx_xml = "2.0"
rbx_binary = "2.0"
blake3 = { version = "1.5", features = ["rayon"] }
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
