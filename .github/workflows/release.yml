# Build release binaries for every tag shaped like v1.2.3 and attach them to
# a GitHub release, named so `ubi` (and therefore mise) can pick the right
# one per platform:
#
#   git-rbx-v1.2.3-macos-aarch64.tar.gz
#   git-rbx-v1.2.3-macos-x86_64.tar.gz
#   git-rbx-v1.2.3-linux-x86_64.tar.gz
#   git-rbx-v1.2.3-windows-x86_64.zip
#
# Consumers then add to mise.toml:
#
#   [tools]
#   "ubi:revvy02/git-rbx" = "latest"
#
# Cutting a release: bump `version` in Cargo.toml, commit, then
# `git tag v<version> && git push origin v<version>`. The verify job refuses
# tags that disagree with Cargo.toml so `git rbx --version` always matches
# the release it came from.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Init rbx-dom submodule
        # rc-fixtures is a private submodule; `submodules: true` would fail
        # to clone it. Only rbx-dom is a build dependency.
        run: git submodule update --init rbx-dom

      - name: Version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check Cargo.toml version matches the tag
        shell: bash
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$cargo_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Cargo.toml version is $cargo_version but the tag is ${{ github.ref_name }}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        # Fixture-backed tests skip here (private submodule not checked out);
        # everything synthetic and the real-git CLI tests still run.
        run: cargo test --release --locked

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # linux-aarch64 omitted: GitHub's hosted ARM runners are paid for
          # private repositories. Add `ubuntu-24.04-arm` /
          # `aarch64-unknown-linux-gnu` here if the repo goes public.
    env:
      ASSET: git-rbx-v${{ needs.verify.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Init rbx-dom submodule
        run: git submodule update --init rbx-dom

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          tar -czf "$GITHUB_WORKSPACE/$ASSET.tar.gz" git-rbx

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          7z a "$GITHUB_WORKSPACE/$ASSET.zip" git-rbx.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.*
          if-no-files-found: error

  release:
    name: Create release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -l artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # v1.0.0-rc.1 style tags are prereleases so the previous stable
          # release stays "Latest" (which is what `ubi ... = "latest"` picks).
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
          fail_on_unmatched_files: true
