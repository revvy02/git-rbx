[tools]
rust = "stable"
node = "24"
"ubi:revvy02/rodeo" = "v1.2.0-rc.4"
"ubi:Kampfkarren/selene" = "latest"
"ubi:JohnnyMorganz/luau-lsp" = "latest"
"ubi:rojo-rbx/rojo" = "latest"
stylua = "latest"
[env]
_.path = ["./bin"]

[tasks.build]
description = "Build the release binary into bin/"
run = "cargo build --release && mkdir -p bin && cp target/release/rbx-diff bin/rbx-diff"
